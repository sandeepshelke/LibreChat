version: 1.3.6
cache: false
interface:
  traceViewer:
    enabled: true
    source: local
    showToolNames: true
mcpServers:
  fixture:
    type: stdio
    command: node
    args:
      - /app/local-fixtures/mcp.cjs
    timeout: 20000
endpoints:
  custom:
    - name: Fixture
      apiKey: fixture-only
      baseURL: http://image-model:4010/v1
      models:
        default:
          - qwen-fixture
        fetch: false
      titleConvo: false
